## Beispielkonfiguration des ip³ Leitstands
## Kopie als config.toml daneben legen und ausfüllen. Die config.toml gehört nicht ins Repo.
## Geheimnisse (Sitzungsschlüssel, API-Zugänge) stehen nicht hier, sondern in der .env.
## Windows-Pfade mit einfachen Anführungszeichen schreiben, dann sind Backslashes unproblematisch.

[app]
umgebung = "entwicklung"       # entwicklung | test | produktion
adresse = "127.0.0.1"          # hinter Caddy nur lokal lauschen
port = 8000
# Basisadresse, unter der die Nutzer den Leitstand aufrufen. Wird für die Prüfung der
# Anfrageherkunft (CSRF) gebraucht; bei mehreren Adressen alle aufführen.
erlaubte_herkunft = ["https://leitstand.ip3.local"]

[pfade]
# Die Datenbank liegt lokal auf dem Host. Niemals in OneDrive oder auf einem Netzlaufwerk:
# SQLite und Ordnersynchronisation zerstören sich gegenseitig. Die Anwendung verweigert
# den Start, wenn der Pfad nach einem Sync-Ordner aussieht.
datenbank = 'D:\ip3-leitstand\daten\leitstand.sqlite3'
logs = 'D:\ip3-leitstand\logs'
backup = 'C:\Users\<nutzer>\OneDrive - ip3\04_Backup'
rechnungen = 'C:\Users\<nutzer>\OneDrive - ip3\01_Rechnungen'
datev = 'C:\Users\<nutzer>\OneDrive - ip3\02_DATEV'
kalkulation = 'C:\Users\<nutzer>\OneDrive - ip3\03_Kalkulation'
# Ordner mit der Angebotsliste aus dem Angebots-Tool (Phase 7). Wird nur gelesen. Leer heisst:
# die Pipeline wird von Hand gepflegt, ohne Import. Erwartet wird eine Datei, deren Name mit
# 'angebote' beginnt, als .xlsx oder .csv.
angebote = ''
# Wurzel der Projektordner: ein Ordner je Projekt, die Projektnummer im Namen. Wird nur
# gelesen – der Leitstand legt dort nichts an, verschiebt und benennt nichts um. Leer heisst:
# kein Doku-Vollstaendigkeitsscan.
projekte = 'C:\Users\<nutzer>\OneDrive - ip3\05_Projekte'
# Ordner mit den Abrechnungen des Netzbetreibers fuer die eigenen Anlagen. Wird nur gelesen.
# Leer heisst: die Abrechnungen werden von Hand erfasst. Als .csv oder .xlsx, nicht als PDF.
einspeisung = ''
# Ordner mit den beiden Excel-Bestandsdateien fuer die Einmal-Migration (PLAN §9). Wird nur
# gelesen. Nach der Uebernahme werden die Dateien schreibgeschuetzt, das Werkzeug ist dann
# fuehrend; der Eintrag darf danach leer bleiben.
migration = 'D:\ip3-leitstand\migration-quellen'
# Ausgelieferte Oberfläche; leer lassen, solange mit dem Vite-Entwicklungsserver gearbeitet wird.
frontend = ""
# Corporate-Design-Assets (Schriften, Logos) fuer das Rechnungs-PDF. Leer heisst: der Ordner
# assets/cd neben der Anwendung. Nur setzen, wenn die Assets im Betrieb woanders liegen.
cd_assets = ""

[firma]
# Pflichtangaben für den Rechnungskopf nach § 14 UStG. Übernommen aus der bestehenden
# Rechnungsvorlage; nur die Steuernummer fehlt noch (siehe docs/OFFENE-PUNKTE.md).
kuerzel = "ip3"
firmierung = "ip³ Energietechnik GmbH"
strasse = "Brandweg 1"
plz = "92637"
ort = "Theisseil"
ust_id = "DE346672260"
st_nr = "<Steuernummer – fehlt noch>"
hrb = "HRB 5725 Amtsgericht Weiden"
geschaeftsfuehrer = "Sven Wilhelm, Michael Bäumler"
telefon = "+49 961 40191 360"
telefax = "+49 961 40191 369"
email = "info@ip3-energie.de"
web = "www.ip3-energie.de"

[firma.bank]
# Bankverbindung nur in der config.toml auf dem Host ausfüllen, nicht hier: die Beispieldatei
# liegt im Repository.
institut = "<Bank>"
iban = "<IBAN>"
bic = "<BIC>"

[sitzung]
# Siehe docs/OFFENE-PUNKTE.md Nr. 3.
dauer_stunden = 12
dauer_angemeldet_bleiben_tage = 30
leerlauf_stunden = 8
# In der Entwicklung ohne TLS auf false; im Betrieb hinter Caddy immer true.
cookie_secure = false

[anmeldung]
# Siehe docs/OFFENE-PUNKTE.md Nr. 4.
max_fehlversuche = 5
sperre_minuten = 15
passwort_mindestlaenge = 12

[fakturierung]
# Vorbelegung, bis Sven entschieden hat (docs/OFFENE-PUNKTE.md).
zahlungsziel_tage = 14
skonto_toleranz_prozent = 3.0
# Kleinbetragsrechnungen unter diesem Bruttobetrag (in Cent) bleiben ohne E-Rechnung.
kleinbetrag_grenze_cent = 25000

[fakturierung.texte]
# Textbausteine des Rechnungs-PDF, woertlich aus der bestehenden Word-Vorlage uebernommen.
# Aenderbar ohne Codeaenderung. Platzhalter in Klammern werden beim Rendern ersetzt.
# Die Pflichthinweise zur Umsatzsteuer stehen bewusst NICHT hier: sie sind steuerlich verlangt
# und gehoeren nicht zu den Texten, die man nach Belieben umformuliert.
anrede_firma = "Sehr geehrte Damen und Herren,"
anrede_privat = "Sehr geehrte Damen und Herren,"
einleitung_abschlag = "wir danken fuer Ihr Vertrauen in unsere fuer Sie erbrachten Leistungen und erlauben uns, diese vereinbarungsgemaess wie folgt zu verrechnen:"
einleitung_schluss = "wir danken fuer Ihr Vertrauen und rechnen die erbrachten Leistungen nach Fertigstellung wie folgt endgueltig ab:"
einleitung_service = "wir danken fuer Ihr Vertrauen in unsere fuer Sie erbrachten Serviceleistungen und erlauben uns, diese wie folgt zu verrechnen:"
einleitung_ab = "wir danken fuer Ihren Auftrag und bestaetigen Ihnen den Umfang und die vereinbarten Zahlungen wie folgt:"
zahlungsbedingung = "Wir bitten Sie, den Rechnungsbetrag ohne Abzug bis zum {faellig_am} ({zahlungsziel_tage} Tage) auf das unten genannte Konto zu leisten."
grussformel = "Mit freundlichen Gruessen"

[datev.kostentraeger]
# Import der Kostentraegerauswertung aus 02_DATEV (Phase 4, PLAN §8).
# Uebernommen wird nur, was in diesen Kontenbereichen liegt. Vorbelegt mit dem Aufwandsbereich
# des SKR03; Erloese (8000er) bleiben damit draussen. Bei SKR04 auf ["5000-7999"] aendern.
# Vor dem ersten echten Export mit der Buchhaltung abstimmen.
kostenkonten = ["3000-4999"]

# Spaltennamen des Kanzlei-Exports. Je Feld sind mehrere Schreibweisen erlaubt; die erste, die
# im Kopf der Datei vorkommt, gewinnt. Gross- und Kleinschreibung, Leerzeichen und Bindestriche
# spielen beim Vergleich keine Rolle. Wenn der echte Export abweichende Namen traegt, hier
# ergaenzen -- der Leitstand muss dafuer nicht geaendert werden.
[datev.kostentraeger.spalten]
kostentraeger = ["KOST2", "KOST2 - Kostenstelle", "Kostentraeger", "Kostenträger"]
konto = ["Konto", "Sachkonto", "Kontonummer"]
kontobezeichnung = ["Kontobezeichnung", "Kontenbeschriftung", "Konto-Bezeichnung"]
betrag = ["Umsatz", "Umsatz (ohne Soll/Haben-Kz)", "Betrag", "Wert"]
soll_haben = ["Soll/Haben-Kennzeichen", "S/H", "SH", "Soll/Haben"]
datum = ["Belegdatum", "Datum", "Buchungsdatum"]
beleg = ["Belegfeld 1", "Belegnummer", "Beleg"]
buchungstext = ["Buchungstext", "Text", "Bezeichnung"]

[datev.susa]
# Summen- und Saldenliste aus 02_DATEV (Phase 5) - traegt den Fixkostenblock des Cockpits.
# Gerechnet wird die Monatsbewegung, nicht der kumulierte Saldo seit Jahresbeginn. Fuehrt die
# Datei beides, gewinnt die Periode; fuehrt sie nur den Saldo, vermerkt es das Protokoll.
monatssaldo_bevorzugen = true

[datev.susa.spalten]
konto = ["Konto", "Sachkonto", "Kontonummer"]
bezeichnung = ["Kontobezeichnung", "Kontenbeschriftung", "Bezeichnung"]
saldo = ["Saldo", "Endsaldo", "Saldo kumuliert", "Betrag"]
soll_haben = ["Soll/Haben-Kennzeichen", "S/H", "SH", "Soll/Haben"]
monatssaldo = ["Monatssaldo", "Periodensaldo", "Bewegung", "Umsatz Periode"]

[datev.opos.spalten]
# Offene Posten Debitoren (Phase 5). Der Dateiname traegt einen vollen Stichtag
# (opos_JJJJ-MM-TT.csv), keinen Monat - eine OPOS-Liste gilt fuer einen Tag.
rechnung_nr = ["Rechnungsnummer", "Beleg", "Belegfeld 1", "Belegnummer"]
kunde = ["Kunde", "Debitor", "Name", "Kontobezeichnung"]
betrag = ["Rechnungsbetrag", "Betrag", "Umsatz", "Bruttobetrag"]
offen_betrag = ["Offener Betrag", "Offen", "Restbetrag", "Saldo"]
faellig_am = ["Faelligkeit", "Fälligkeit", "Faellig am", "Fällig am", "Nettofaellig"]
datum = ["Belegdatum", "Rechnungsdatum", "Datum"]

[stundensaetze]
# Verrechnungssaetze fuer die kalkulatorische Eigenleistung (Phase 4, PLAN §6.6).
# ACHTUNG: die Betraege unten sind Platzhalter und noch nicht bestaetigt (PLAN §13.6).
# Satz fuer Mitarbeiter ohne Zuordnung, in Cent je Stunde.
standard = 6500

[stundensaetze.saetze]
# Satzgruppen, in Cent je Stunde.
monteur = 6500
obermonteur = 7500
elektriker = 7800
planung = 8500

[stundensaetze.mitarbeiter]
# Zuordnung Mitarbeitername (wie in TimeTac) zu Satzgruppe. Ein Name, der hier fehlt, rechnet
# mit dem Standardsatz und erscheint als Pflegehinweis im Importprotokoll -- nichts faellt
# still unter den Tisch. Gross-/Kleinschreibung und Leerzeichen spielen keine Rolle.
# "Wilhelm, Sven" = "planung"
# "Baeumler, Michael" = "obermonteur"

[timetac]
# Schnittstelle zu TimeTac (Phase 4, PLAN §8).
# Zugangsdaten stehen NICHT hier, sondern in der .env auf dem Host:
# IP3_TIMETAC_CLIENT_ID, IP3_TIMETAC_CLIENT_SECRET, IP3_TIMETAC_KONTO.
aktiv = true
basis_url = "https://api.timetac.com"
zeitlimit_sekunden = 30.0
seitengroesse = 200
# Wie viele Monate rueckwirkend der naechtliche Lauf holt (0 = nur der laufende Monat).
monate_rueckwirkend = 1

# Feldnamen der API-Antwort. Vorbelegt nach der v3-Dokumentation; der erste echte Lauf findet
# auf dem Windows-Host statt (die Entwicklungsumgebung erreicht api.timetac.com nicht). Weicht
# die Antwort ab, wird hier nachgezogen -- 'ip3-leitstand timetac-test' zeigt, was ankommt.
[timetac.felder]
projekt = ["project_name", "projectName", "project"]
projekt_nr = ["project_number", "projectNumber", "external_id"]
mitarbeiter = ["user_name", "userName", "employee", "user"]
datum = ["date", "start_time", "startTime"]
dauer_sekunden = ["duration", "duration_seconds", "worked_time"]
dauer_stunden = ["hours", "duration_hours"]

# Spaltennamen des CSV-Berichtsexports (Rueckfallebene, wenn die Schnittstelle ausfaellt oder
# alte Monate nachzuladen sind).
[timetac.spalten]
projekt = ["Projekt", "Project", "Projektname"]
mitarbeiter = ["Mitarbeiter", "Benutzer", "Name", "User"]
datum = ["Datum", "Date", "Tag"]
dauer = ["Dauer", "Stunden", "Arbeitszeit", "Duration"]
aufgabe = ["Aufgabe", "Task", "Taetigkeit", "Tätigkeit"]

[nachkalkulation]
# Abstand zur Sollmarge, ab dem eine Marge als "knapp" gilt: 50 Promille sind 5 Prozentpunkte
# (Phase 4). Eine Einschaetzung, keine Rechengroesse -- die Marge selbst beruehrt das nicht.
ampel_gelb_promille = 50

[kapazitaet]
# Kapazitaetsplanung je Kalenderwoche (Phase 7). Die Wochenstunden je Person stehen in der
# Datenbank und werden in der Oberflaeche gepflegt, nicht hier.
# Wie viele Wochen die Ansicht nach vorn zeigt. Ein Quartal ist der Horizont, in dem sich eine
# Montage noch verschieben laesst; alles darueber ist Kaffeesatz.
wochen_voraus = 13
# Ab welcher Auslastung die Woche als eng gilt: 900 Promille sind 90 %.
warnung_ab_promille = 900
# Meilensteine, ueber deren geplante Kalenderwochen die Sollstunden verteilt werden.
montage_meilensteine = ["montage_uk", "montage_elektro", "zaehlerschrank", "montage"]
# Projektstatus, deren Sollstunden Mannschaft binden.
status_mit_bedarf = ["beauftragt", "in_bau"]

[angebote]
# Angebotspipeline (Phase 7). Vorbelegung fuer ein neu erfasstes Angebot: 500 Promille = 50 %.
standard_wahrscheinlichkeit_promille = 500

[angebote.spalten]
# Spalten des Angebots-Tools. Wie bei DATEV und TimeTac: je Feld mehrere Schreibweisen, die
# erste im Dateikopf gefundene gewinnt. Die echte Datei liegt noch nicht vor -- kommt sie, wird
# hier ergaenzt, der Leitstand muss dafuer nicht geaendert werden.
angebot_nr = ["Angebotsnummer", "Angebot-Nr.", "Angebot Nr", "Nummer", "Nr."]
kunde = ["Kunde", "Kundenname", "Interessent", "Firma", "Name"]
bezeichnung = ["Bezeichnung", "Projekt", "Vorhaben", "Betreff"]
summe = ["Angebotssumme", "Summe netto", "Nettosumme", "Summe", "Betrag"]
wahrscheinlichkeit = ["Wahrscheinlichkeit", "Chance", "Trefferquote", "Abschlusswahrscheinlichkeit"]
erwarteter_monat = ["Erwarteter Auftrag", "Auftragsmonat", "Erwartet", "Monat"]
status = ["Status", "Stand"]
datum = ["Angebotsdatum", "Datum", "Erstellt am"]

[angebote.status_zuordnung]
# Wie die Statuswerte der Datei zu offen/gewonnen/verloren werden. Was hier nicht steht, gilt
# als offen und wird im Protokoll genannt -- nicht stillschweigend verworfen.
offen = "offen"
versendet = "offen"
"in verhandlung" = "offen"
gewonnen = "gewonnen"
beauftragt = "gewonnen"
auftrag = "gewonnen"
verloren = "verloren"
abgelehnt = "verloren"
abgesagt = "verloren"

[dokumente]
# Doku-Vollstaendigkeitsscan der Projektordner (Phase 7). Der Scan liest [pfade] projekte,
# ordnet jeden Ordner ueber die Nummer im Namen einem Projekt zu und jede Datei ueber den
# Dateinamen einem Typ.
# Was vor einer Schlussrechnung im Ordner liegen muss. Fehlt etwas davon, warnt die Belegmaske
# und verlangt eine ausdrueckliche Bestaetigung -- sie sperrt nicht (Entscheidung 50).
# Erlaubt: ab, abnahme, anlagendoku, konformitaet, messkonzept, sonstig.
pflicht = ["anlagendoku"]
# Welche Dateiendungen ueberhaupt als Unterlage zaehlen.
endungen = [".pdf", ".jpg", ".jpeg", ".png", ".tif"]
# Wie viele Ebenen unter dem Projektordner mitgelesen werden.
tiefe = 2

[dokumente.muster]
# Woran der Scan einen Typ im Dateinamen erkennt. Verglichen wird kleingeschrieben und ohne
# Umlaute; der erste Treffer in dieser Reihenfolge gewinnt, deshalb stehen die eindeutigen
# Begriffe vorn. Neue Schreibweisen gehoeren hierher, nicht in den Code.
abnahme = ["abnahmeprotokoll", "abnahme", "uebergabeprotokoll"]
konformitaet = ["konformitaetserklaerung", "konformitaet", "fertigmeldung", "inbetriebnahmeprotokoll", "e8"]
messkonzept = ["messkonzept", "messstellenkonzept", "zaehlerkonzept"]
anlagendoku = ["anlagendokumentation", "anlagendoku", "uebergabemappe", "dokumentation", "datenblaetter"]
ab = ["auftragsbestaetigung", "auftragsbest"]

[einspeisung]
# Verguetungs-Controlling der eigenen Bestandsanlagen (Phase 7). Der Leitstand rechnet die
# erwartete Gutschrift aus den Stammdaten der Anlage und stellt sie der Abrechnung des
# Netzbetreibers gegenueber. Das ist eine Kontrollrechnung, keine Buchung.
# Ab welcher Abweichung gemeldet wird. 20 Promille sind 2 Prozent.
toleranz_promille = 20
# Nach wie vielen Tagen eine abgerechnete, aber nicht bezahlte Gutschrift als ueberfaellig gilt.
zahlungsziel_tage = 45

[einspeisung.spalten]
# Spaltennamen der Netzbetreiber-Abrechnung. Erfunden, solange die echte Datei fehlt -- sie
# sind ohne Codeaenderung nachzuziehen. Der erste gefundene Name je Zeile gewinnt.
zaehler = ["Zählernummer", "Zaehlernummer", "Zähler", "Zählpunkt", "Messlokation"]
mastr = ["MaStR-Nr.", "MaStR", "Marktstammdatenregister", "SEE-Nummer"]
anlage = ["Anlage", "Anlagenbezeichnung", "Bezeichnung"]
monat = ["Abrechnungsmonat", "Monat", "Zeitraum", "Leistungsmonat"]
kwh = ["Menge kWh", "kWh", "Einspeisemenge", "Menge", "Arbeit"]
betrag = ["Betrag netto", "Nettobetrag", "Vergütung", "Betrag", "Summe"]

[gewaehrleistung]
# Vertragsart je Kundentyp, die beim Projektabschluss vorgeschlagen wird (Phase 6, PLAN §6.9).
# Erlaubt sind nur "vob" (vier Jahre) und "bgb" (fünf Jahre). Gegenüber Verbrauchern gilt in
# aller Regel BGB, weil VOB/B dort nur wirksam wird, wenn sie im Ganzen vereinbart ist.
# Es ist eine Vorbelegung, keine Festlegung: beim Abschluss laesst sich die Art aendern.
vorbelegung = { b2b = "vob", b2c = "bgb" }
# Wie lange vor Ablauf die Gewaehrleistungsfrist auf der Startseite erscheint (PLAN §6.9).
vorlauf_tage = 90

[fristen]
# Vorlauf fuer Fristen, die keinen eigenen mitbringen.
vorlauf_tage = 30
# Frist zur Registrierung im Marktstammdatenregister nach Inbetriebnahme:
# § 5 Abs. 1 MaStRV verlangt sie binnen eines Monats.
mastr_tage = 30

[jobs]
# Nächtliche Läufe in Ortszeit (Europe/Berlin).
backup_uhrzeit = "01:30"
backup_generationen = 30
# Ab wie vielen Stunden ohne erfolgreichen Lauf der Systemstatus warnt.
backup_max_alter_stunden = 26

[protokoll]
stufe = "INFO"                 # DEBUG | INFO | WARNING | ERROR
datei_max_mb = 10
generationen = 10
