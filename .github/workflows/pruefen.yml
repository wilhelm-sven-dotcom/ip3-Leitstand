name: Prüfen

# Läuft bei jedem Push und Pull Request. Was hier grün ist, sollte auch auf dem Bürorechner
# funktionieren – die Testinstanz bleibt trotzdem der letzte Schritt vor einem Update (RUNBOOK).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: uv einrichten
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Abhängigkeiten installieren
        run: uv sync --frozen

      - name: Linter
        run: uv run ruff check .

      - name: Formatierung
        run: uv run ruff format --check .

      - name: Tests
        # Der niedrige bcrypt-Faktor gilt nur hier (siehe tests/conftest.py); im Betrieb bleibt
        # es bei 12, was ein Test absichert.
        env:
          IP3_BCRYPT_KOSTEN: "4"
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typprüfung
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Der Build ist die eigentliche Regressionsprüfung: er scheitert bei fehlenden
      # Assets, unauflösbaren Aliassen und Typfehlern.
      - name: Build
        run: npm run build
