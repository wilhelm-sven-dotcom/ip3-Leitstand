; Alembic-Konfiguration des ip³ Leitstands.
; Die Datenbank-URL steht nicht hier, sondern kommt in alembic/env.py aus der Konfiguration
; (PLAN §2: keine Pfade im Code und keine doppelte Pfadpflege).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Migrationsdateien mit Nummer und sprechendem Namen, z. B. 0001_grundschema.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
