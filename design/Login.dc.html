<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#0C1A3D}a{color:#E8E7EF;text-decoration:none}a:hover{color:#FFFFFF}::selection{background:#C83C30;color:#fff}input::placeholder{color:rgba(232,231,239,0.45)}</style>
</helmet>
<div style="position:relative;min-height:100vh;background:#0C1A3D;font-family:'Libre Franklin',Arial,sans-serif;overflow:hidden;display:flex;align-items:stretch">
  <img src="brand/zeichen-3-kontur-akzent.png" alt="" style="position:absolute;height:120vh;top:-9vh;right:-16vh;opacity:{{ zeichenDeckkraft }};pointer-events:none;user-select:none">
  <div style="position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:64px 0 64px 11vw;width:400px;max-width:86vw">
    <img src="brand/ip3-energietechnik-weiss.svg" alt="ip³ Energietechnik GmbH" style="width:236px;display:block;margin-bottom:56px">
    <div style="font-size:34px;font-weight:800;letter-spacing:-0.02em;color:#FFFFFF;margin-bottom:6px">Anmelden<span style="color:#C83C30">.</span></div>
    <div style="font-size:13.5px;color:#E8E7EF;opacity:0.75;margin-bottom:36px">Internes Projekt- und Finanz-Cockpit</div>
    <div style="display:flex;flex-direction:column;gap:18px">
      <label style="display:flex;flex-direction:column;gap:7px">
        <span style="font-size:12.5px;font-weight:600;color:#E8E7EF;letter-spacing:0.01em">E-Mail</span>
        <input type="email" placeholder="vorname@ip3-energie.de" style="height:44px;border-radius:6px;border:1px solid rgba(232,231,239,0.35);background:rgba(255,255,255,0.06);color:#FFFFFF;font-family:'Libre Franklin',Arial,sans-serif;font-size:14px;padding:0 14px;outline:none;transition:border-color 180ms" style-focus="border-color:#FFFFFF;background:rgba(255,255,255,0.09)">
      </label>
      <label style="display:flex;flex-direction:column;gap:7px">
        <span style="font-size:12.5px;font-weight:600;color:#E8E7EF;letter-spacing:0.01em">Passwort</span>
        <input type="password" placeholder="••••••••••" style="height:44px;border-radius:6px;border:1px solid rgba(232,231,239,0.35);background:rgba(255,255,255,0.06);color:#FFFFFF;font-family:'Libre Franklin',Arial,sans-serif;font-size:14px;padding:0 14px;outline:none;transition:border-color 180ms" style-focus="border-color:#FFFFFF;background:rgba(255,255,255,0.09)">
      </label>
      <label style="display:flex;align-items:center;gap:9px;font-size:13px;color:#E8E7EF;cursor:pointer;margin-top:2px">
        <input type="checkbox" checked="{{ true }}" style="width:15px;height:15px;accent-color:#C83C30;margin:0">
        Angemeldet bleiben
      </label>
      <a href="Start.dc.html" style="display:flex;align-items:center;justify-content:center;height:46px;border-radius:6px;background:#C83C30;color:#FFFFFF;font-size:14.5px;font-weight:700;letter-spacing:0.01em;margin-top:10px;transition:background 180ms" style-hover="background:#B0342A;color:#FFFFFF">Anmelden</a>
      <a href="#" style="font-size:12.5px;color:#E8E7EF;opacity:0.7;text-decoration:underline;text-underline-offset:3px;align-self:flex-start" style-hover="opacity:1">Passwort vergessen?</a>
    </div>
  </div>
  <div style="position:absolute;left:11vw;right:11vw;bottom:0;z-index:2;border-top:1px solid rgba(232,231,239,0.22);padding:16px 0 20px;display:flex;justify-content:space-between;gap:16px;font-size:11px;color:rgba(232,231,239,0.55)">
    <span>ip³ Energietechnik GmbH · Theisseil · info@ip3-energie.de · www.ip3-energie.de</span>
    <span>Nur für interne Nutzung</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;zeichenDeckkraft&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 0.2, &quot;min&quot;: 0.08, &quot;max&quot;: 0.35, &quot;step&quot;: 0.01, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Zeichen 3&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { zeichenDeckkraft: this.props.zeichenDeckkraft ?? 0.2 };
  }
}
</script>
</body>
</html>
